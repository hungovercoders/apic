name: release
# Merging the release pull request is the release: it dates a section of
# CHANGELOG.md, and the push to main that carries it lands here, tags the
# commit and releases it in one run (see docs/releasing.md). A version tag
# pushed by hand still releases too, for a release cut from elsewhere.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: a hand-pushed tag racing the merge that carries the
# same version waits, then finds the release done and does nothing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # What, if anything, this run releases. From a push to main or a manual
  # run: the newest dated section of CHANGELOG.md, unless it already has a
  # GitHub release (a push that only added lines under Unreleased, or a
  # re-run after a release went out). From a tag: that tag, unless it is the
  # moving major tag (v0) the last step maintains, which has no dot.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(go run ./scripts/changelog -latest)"
          fi
          release=true
          case "$tag" in *.*) ;; *) release=false ;; esac
          if [ "$release" = true ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do"
            release=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "release $tag: $release"

  goreleaser:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # OIDC identity for cosign keyless signing
      packages: write # push ghcr.io/hungovercoders/apic
    # Writing the Homebrew cask to hungovercoders/homebrew-tap needs a token
    # for that repository: GITHUB_TOKEN only reaches this one. The secret is
    # a fine-grained PAT with contents read and write on the tap, nothing
    # else (see AGENTS.md, Releasing).
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Fail before anything is built or uploaded, not at the last step
      # with the archives already on the release.
      - name: The Homebrew tap token is set
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set: add a fine-grained PAT with contents write on hungovercoders/homebrew-tap as a repository secret"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The release notes are this version's section of CHANGELOG.md,
      # written by hand in the pull requests that made the release (see
      # docs/releasing.md). The tag must be the newest dated section, and
      # the site's changelog page and version pins must already name it
      # (task docs:changelog): fail here, with nothing built, rather than
      # publish a release that says nothing or docs that name the last one.
      # From main, release the commit that brought the dated section onto
      # main, not whatever main holds by the time this runs: a manual run or
      # a re-run must not ship work merged since. An existing tag (a re-run
      # after a failed release, or one pushed by hand) is used as it is.
      - name: Check out the release commit
        if: github.ref_type != 'tag'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
          else
            commit="$(git log -1 --first-parent --diff-merges=first-parent --no-patch --format=%H -S "## [${TAG#v}] - " -- CHANGELOG.md)"
            test -n "$commit" || { echo "::error::no commit on main dates ${TAG#v} in CHANGELOG.md"; exit 1; }
            git checkout -q "$commit"
          fi
          git log -1 --oneline
      - name: The changelog and the docs name this version
        run: go run ./scripts/changelog -release "$TAG" > "$RUNNER_TEMP/release-notes.md"
      # Tag it once the checks pass. The tag is pushed with GITHUB_TOKEN,
      # which starts no workflow of its own, so this run is its only release.
      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "apic ${TAG#v}"
            git push origin "refs/tags/$TAG"
          fi
      # cosign signs checksums.txt; syft builds the per-archive SBOMs. Neither
      # ships with the runner or with goreleaser-action, so both are installed
      # here rather than silently skipped.
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      # The image (see Dockerfile) is built for amd64 and arm64 with buildx,
      # which also attaches an SBOM attestation. Its Alpine stage runs on the
      # build platform, so no QEMU is needed for arm64.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # The published image runs, and reports the version it was tagged with.
      - name: Smoke-test the image
        run: |
          version="${TAG#v}"
          docker run --rm "ghcr.io/hungovercoders/apic:${version}" version | grep -F "apic ${version}"
      # `uses: hungovercoders/apic/setup-apic@v0` follows the newest 0.x
      # release, the way actions/checkout@v4 does: move the major tag to
      # this commit once the release is out.
      - name: Move the major tag for setup-apic
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"

  # The MCP registry (registry.modelcontextprotocol.io) lists the server the
  # image provides as io.github.hungovercoders/apic, so an MCP client that
  # installs servers from a catalogue finds apic there. server.json at the
  # root is the listing with its version left at 0.0.0; this job fills in
  # the tag's version and the image it names, which the first job has
  # pushed by now and which carries the io.modelcontextprotocol.server.name
  # label the registry checks (see .goreleaser.yaml). A job of its own, so
  # a registry outage fails the listing and not the release.
  mcp-registry:
    needs: [plan, goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    env:
      # Bumped deliberately, never "latest": the archive is verified against
      # the registry's own release signature for this exact tag.
      MCP_PUBLISHER_VERSION: v1.8.1
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: sigstore/cosign-installer@v3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Set the version and the image in server.json
        run: |
          version="${TAG#v}"
          jq --arg v "$version" \
            '.version = $v | .packages[].identifier = "ghcr.io/hungovercoders/apic:" + $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc
      - name: Publish the listing
        run: ./mcp-publisher publish
