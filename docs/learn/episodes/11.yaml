# Lesson 11's episode. The lesson leaves the demo API behind, and the
# builder records only against it, so the live calls to httpbin, GitHub
# and Spotify are cards carrying the page's sample output. Everything
# that runs offline runs on camera: the example projects' files,
# describe and validate on them, the private-file rule, and the exercise.
# The first clip copies the repository's examples into the scratch
# directory as setup, which sees the repository root as EPISODE_REPO.
lesson: 11
summary: "Run apic against three real services with the three example projects, keep the credentials out of git, and make task the way your team runs all of it."
project: true
thumbnail:
  words: "Real APIs and\nthe Taskfile"
  clip: spotifydesc

shots:
  - chapter: Real APIs
    card:
      series: From zero to apic · lesson 11
      title: "Real APIs and\nthe Taskfile front door"
      text: "$ `apic run search.http -C examples/spotify`"
    say:
      - "This is lesson eleven of From zero to apic. Everything so far was the demo. Now the internet: three real services, the three example projects, and the way a team runs all of it."

  - chapter: Real APIs
    card:
      heading: Now the internet
      text: |-
        `$ apic run search.http -C examples/spotify`
        ✓ search-artist  200  420 ms
        ✓ new-releases   200  260 ms

        2 passed · 2 requests · 680 ms
      foot: Two green lines against a real API, no code · `git clone --depth 1 https://github.com/hungovercoders/apic`
    say:
      - "Two green lines against the real Spotify API, no code. The three examples live in the repository's examples directory. Clone it, and every project in this lesson is a dash C away."

  - chapter: httpbin
    clip: httpbin
    wide: true
    setup:
      - sh: |
          cp -r "$EPISODE_REPO/examples" examples
          cp "$EPISODE_REPO/.gitignore" .gitignore
    tape: |
      Type "apic list -C examples/httpbin" Enter Sleep 4s
      Type "sed -n 1,10p examples/httpbin/auth.http" Enter Sleep 6s
    say:
      - "httpbin is a public echo service: it answers with what you sent, which makes it a good first real target. The example has two environments. dev points at httpbin.org, and local at apic demo, for the requests that both serve."
      - "httpbin has no login, so login posts a token it made up itself, demo dash uuid, and captures it back out of the echo. Nothing here is special to httpbin: it is the same capture and auth from lessons three and six, on the open internet."

  - chapter: httpbin
    card:
      heading: httpbin, live
      text: |-
        `$ apic run auth.http -C examples/httpbin --env dev`
        ✓ login        200  312 ms
        ✓ whoami       200  298 ms
        ✓ basic-auth   200  301 ms
        ✓ bearer-auth  200  295 ms

        `$ apic run users.http -C examples/httpbin --env dev --keep-going`
        ✓ get-user     200  305 ms
        ✓ create-user  200  299 ms
        ✓ not-found    404  290 ms
      foot: The timings are the network's
    say:
      - "The timings are the network's. whoami sends the token to the bearer endpoint, which accepts any bearer token, and basic-auth lets the auth directive encode the credentials."
      - "The second file has a deliberate expected 404. not-found asserts status equals 404, so it passes: an assertion is about what you expect, not about 2xx."

  - chapter: The private file
    clip: private
    tape: |
      Type "cat examples/github/http-client.private.env.json" Enter Sleep 3s
      Type "grep -n private .gitignore" Enter Sleep 5s
    say:
      - "The GitHub example reads one repository through the REST API with a bearer token, and its private file ships with a placeholder. Two things about that file."
      - "The repository's root gitignore ignores every private env file, then re-includes the ones under examples so the placeholders can be committed. In your own project the ignore line stands alone, and apic init writes it for you. And apic writes the file with mode 0600 when it creates one, so nobody else on the machine reads it either."

  - chapter: GitHub
    clip: github
    tape: |
      Type "apic describe get-repo -C examples/github" Enter Sleep 6s
    say:
      - "Make a token on GitHub, a fine-grained personal access token with no permissions at all. The three requests read public data; the token only raises the rate limit and identifies you. Put it in the file, and describe shows the request ready, with the token masked because of where it came from."

  - chapter: GitHub
    card:
      heading: GitHub, live
      text: |-
        `$ apic run repo.http -C examples/github`
        ✓ whoami       200  180 ms
        ✓ get-repo     200  160 ms
        ✓ list-issues  200  210 ms

        `$ apic test -C examples/github`
        3 scenarios (3 passed)
        8 steps (8 passed)
      foot: "`env: dev` in `apic.yaml`, so no `--env` is needed"
    say:
      - "env dev in apic.yaml means no dash dash env is needed. The example also carries a feature file, and apic test runs it against the same requests."

  - chapter: Spotify and OAuth2
    clip: spotify
    tape: |
      Type "sed -n 1,10p examples/spotify/search.http" Enter Sleep 6s
    say:
      - "The Spotify example is the OAuth2 flow from lesson six against a real authorization server. Create an app in the developer dashboard and copy its client id and secret into the private file. The request declares everything else."

  - chapter: Spotify and OAuth2
    clip: spotifydesc
    tape: |
      Type "apic describe search-artist -C examples/spotify" Enter Sleep 6s
    say:
      - "clientAuth equals basic is the detail that matters for Spotify: it wants the id and secret in a Basic header on the token request rather than in the form body, and that one word is the difference between a token and a 401. describe shows the spec resolved, both secrets masked, and the request ready."

  - chapter: Spotify and OAuth2
    card:
      heading: Spotify, live
      text: |-
        `$ apic run search.http -C examples/spotify`
        ✓ search-artist  200  420 ms
        ✓ new-releases   200  260 ms

        `$ apic session -C examples/spotify`
        dev
          ↳ $oauth2:4c1d…  = token, expires in 1h0m0s
      foot: On a screen or in a ticket, add `--redact`
    say:
      - "The token was fetched once, before the first request, and cached in the session for its lifetime, described, never printed. The second request reused it. When you show this on a screen or paste it into a ticket, add dash dash redact: the URLs stay, and every header value, body and captured value becomes three stars."

  - chapter: What each needs
    card:
      heading: What each example needs
      table:
        - ["`examples/httpbin`", "`dev` (httpbin.org), `local` · `password` · committed; any value works"]
        - ["`examples/github`", "`dev` · `token` · a fine-grained PAT with no permissions, or `gh auth token`"]
        - ["`examples/spotify`", "`dev` · `clientId`, `clientSecret` · an app in the Spotify developer dashboard"]
      foot: Checked by CI with `apic validate` and `apic fmt --check`, never run there
    say:
      - "What each example needs, in one place: the environment, what the private file holds, and where it comes from. Every example is checked by CI with validate and format check, but never run there: real credentials do not belong in CI for a sample. Your own project is different, and lesson eight is how its secrets travel."

  - chapter: What each needs
    clip: validate
    tape: |
      Type "for p in httpbin github spotify; do apic validate -C examples/$p; done" Enter Sleep 4s
      Type "apic fmt --check -C examples/spotify && echo formatted" Enter Sleep 3s
    say:
      - "The same two checks, by hand: every example valid, every file in the canonical format."

  - chapter: The Taskfile front door
    card:
      heading: "The Taskfile front door"
      text: |-
        vars: { ENV: '{{.ENV | default "dev"}}' }
        tasks:
          api:                 # task api -- get-user --env staging
            `dir: api`
            cmds: [apic run `{{.CLI_ARGS}}`]
          login:
            dir: api
            cmds: [apic run login --env {{.ENV}}]
          smoke:
            dir: api
            cmds: [apic run smoke.http --env {{.ENV}}]
          `api:check`:         # what a newcomer or CI runs
            dir: api
            cmds:
              - apic validate
              - apic run smoke.http --env {{.ENV}} --json --redact
    say:
      - "Once the requests are files, the question is how a team runs them without each person remembering flags. The repository's own Taskfile answers it for the examples, and a project's Taskfile looks like this."
      - "Three details carry the design. dir api on every task puts apic in the same directory each time, so they all share one session and task login once serves task smoke afterwards. CLI_ARGS makes task api behave exactly like apic run, so the Taskfile adds a front door without hiding the tool."

  - chapter: The Taskfile front door
    card:
      heading: One command for a newcomer or a CI job
      text: |-
        `$ APIC_VAR_password="$API_PASSWORD" task api:check ENV=staging`

        Exit codes pass straight through, so a failed assertion fails the task.
      foot: Every pattern, including piping output between tasks · `apic.sh/taskfile/`
    say:
      - "And task api check is the one command a newcomer or a CI job runs, with the secret arriving through the environment. Exit codes pass straight through, so a failed assertion fails the task."

  - chapter: Checkpoint and exercise
    card:
      heading: Checkpoint
      text: |-
        The Spotify flow runs green with your own credentials:
        `$ apic run search.http -C examples/spotify --json | jq -s 'map(.ok) | all'`
        true

        If you skipped Spotify, the GitHub file is the same check:
        `$ apic run repo.http -C examples/github --json | jq -s 'map(.ok) | all'`
    say:
      - "The checkpoint. The Spotify flow runs green with your own credentials, every request ok. If you skipped Spotify, the GitHub file is the same check."

  - chapter: Checkpoint and exercise
    card:
      heading: Exercise
      text: |-
        Add a fourth example project for an API you use, with one flow and one feature.

        Start it with `apic init`, which writes the config, the env files, the
        `.gitignore` lines, a first request and the Agent Skill. Point it at the
        demo API first if the real one needs credentials you do not have to hand.
      foot: Solution on the lesson page · `apic.sh/learn/11-real-apis/`
    say:
      - "Your exercise: a fourth example project for an API you use, with one flow and one feature. Start it with apic init, and point it at the demo API first if the real one needs credentials you do not have to hand."

  - chapter: Checkpoint and exercise
    clip: init
    tape: |
      Type "apic init my-api --base-url http://localhost:8089 --env local" Enter Sleep 4s
      Type "apic run ping -C my-api | tail -1" Enter Sleep 4s
    say:
      - "apic init writes the config, both env files, the gitignore line, a first request with a ping, a smoke feature, and the Agent Skill from lesson ten. Ping runs green against the demo straight away. Replace the base URL with the real API, and validate, run and test are the three checks."

  - chapter: Checkpoint and exercise
    card:
      series: Next · lesson 12
      title: "Editors"
      text: |-
        Every command in this episode: `apic.sh/learn/11-real-apis/`
        The whole course: `apic.sh/learn/`
    say:
      - "Next, lesson twelve: editors. The same request sent from VS Code, a JetBrains IDE, Neovim and apic run, and what each one ignores in the file."
      - Every command from this episode is on the lesson page. See you there.
